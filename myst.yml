# Jupyter Book 2 (MyST) configuration
version: 1
project:
  title: מבוא למצב מוצק תשפ״ז · הדגמות נומריות
  description: הדגמות שבועיות קצרות לתרגולי הקורס מבוא למצב מוצק (אוניברסיטת תל אביב)
  github: https://github.com/yaminbens/SolidState
  license: CC-BY-4.0
  jupyter: true
  copyright: "2026"
  # Weeks 7-11 are kept in the repo but not published yet. To release a week:
  # add its two files to the toc, its two cards to index.md, and delete its line in exclude.
  exclude:
    - week07*
    - week08*
    - week09*
    - week10*
    - week11*
  toc:
    - file: index.md
    - file: week01.ipynb
    - file: week02.ipynb
    - file: week03.ipynb
    - file: week04.ipynb
    - file: week04-crystals.md
    - file: week05.ipynb
    - file: week05-reciprocal.md
    - file: week06.ipynb
    - file: week06-diffraction.md
site:
  template: book-theme
  title: מבוא למצב מוצק תשפ״ז
  options:
    logo_text: מבוא למצב מוצק תשפ״ז
    style: site.css
