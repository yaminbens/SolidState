name: Deploy Jupyter Book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Jupyter Book
        run: pip install "jupyter-book>=2" nbformat
      - name: Prepare notebooks for the site (strip the RTL wrapper that breaks math)
        run: python tools/prepare_site.py
      - name: Build HTML
        env:
          BASE_URL: /${{ github.event.repository.name }}
        run: jupyter-book build --html
      - name: Add the interactive pages (static HTML, embedded by the weekly pages)
        run: cp -r viz _build/html/viz
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
